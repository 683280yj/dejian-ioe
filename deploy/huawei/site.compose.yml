name: chouce-site
services:
  web:
    image: nginx:alpine
    container_name: chouce-site
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./site.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
networks:
  edge:
    external: true
    name: proxy_default
